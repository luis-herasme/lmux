<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- style-src 'unsafe-inline': dockview and xterm inject <style> blocks
         at runtime, with no way to carry a nonce. Electron warns at boot
         that this policy is missing or unsafe; it is neither, it just reads
         response headers and a file:// page has none (ARCHITECTURE.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>lmux</title>
    <link
      rel="stylesheet"
      href="../../node_modules/@xterm/xterm/css/xterm.css"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- code token colors: VS Code's dark palette (vs2015); settings.ts
         swaps the light file in for light themes -->
    <link
      rel="stylesheet"
      href="../../node_modules/@highlightjs/cdn-assets/styles/vs2015.min.css"
      id="highlight-css"
    />
    <!-- Monaco's stylesheet, emitted beside its bundle by the vendor build
         (scripts/bundle-vendor.mjs). Linked here rather than loaded with the
         editor: a stylesheet arriving after the first paint would show the
         editor unstyled for a frame. -->
    <link rel="stylesheet" href="../../dist/vendor/monaco.css" />
  </head>
  <body>
    <!-- <dialog> + showModal(): real modality (backdrop, focus trap,
         Escape) from the browser engine. Electron has no native
         text-input dialog. -->
    <dialog id="rename-dialog">
      <form method="dialog">
        <!-- the heading names the target: a tab or a workspace -->
        <h2 id="rename-heading">Rename Tab</h2>
        <input id="rename-input" type="text" spellcheck="false" />
        <div class="dialog-buttons">
          <!-- Cancel is type=button so Enter always means Rename -->
          <button type="button" id="rename-cancel">Cancel</button>
          <button value="rename" class="default">Rename</button>
        </div>
      </form>
    </dialog>
    <!-- Controls apply live: each change is an update-settings Command
         (settings-dialog.ts) -->
    <dialog id="settings-dialog">
      <h2>Settings</h2>
      <label class="settings-row">
        Theme
        <select id="settings-theme"></select>
      </label>
      <h3 class="settings-section">Terminal</h3>
      <label class="settings-row">
        Font
        <input id="settings-font-family" type="text" spellcheck="false" />
      </label>
      <label class="settings-row">
        Font size
        <input id="settings-font-size" type="number" min="8" max="32" />
      </label>
      <h3 class="settings-section">Interface</h3>
      <label class="settings-row">
        Font
        <input id="settings-ui-font-family" type="text" spellcheck="false" />
      </label>
      <h3 class="settings-section">Markdown</h3>
      <label class="settings-row">
        Font
        <input
          id="settings-markdown-font-family"
          type="text"
          spellcheck="false"
        />
      </label>
      <label class="settings-row">
        Font size
        <input id="settings-markdown-font-size" type="number" min="8" max="32" />
      </label>
      <div class="dialog-buttons">
        <button id="settings-done" class="default">Done</button>
      </div>
    </dialog>
    <!-- The painted title bar (style.css); the native one is hidden -->
    <!-- replaced by the active workspace's name as soon as one exists -->
    <div id="title-bar">lmux</div>
    <div id="workbench">
      <div id="sidebar">
        <!-- one row per workspace, filled by workspaces.ts. A tablist:
             picking one swaps which set of panes is on screen. -->
        <div id="workspace-list" role="tablist" aria-label="Workspaces"></div>
        <button id="new-workspace-button" title="New Workspace (⇧⌘T)">
          + New Workspace
        </button>
        <button id="settings-button" title="Settings" aria-label="Settings">
          ⚙
        </button>
      </div>
      <!-- drag handle over the sidebar's edge (sidebar-resize.ts) -->
      <div id="sidebar-resizer"></div>
      <!-- one Dockview root per workspace, only the active one displayed
           (workspaces.ts) -->
      <div id="layout" role="tabpanel" aria-label="Workspace"></div>
    </div>
    <!-- classic scripts providing globals (how these packages ship);
         the app itself is a native ES module -->
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../node_modules/dockview/dist/dockview.js"></script>
    <script type="module" src="../../dist/renderer/index.js"></script>
  </body>
</html>
