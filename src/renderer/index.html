<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Mermaid injects a <style> per diagram and this page has style
         attributes of its own; Monaco brings the Codicon font, which the
         build may emit inline. Electron warns because a file:// page has no
         response CSP header; the equivalent meta policy below is enforced
         (ARCHITECTURE.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <title>lmux</title>
    <!-- code token colors; settings.ts puts the palette this theme wants
         here. Every other stylesheet is imported by the module needing it. -->
    <link rel="stylesheet" id="highlight-css" />
  </head>
  <body>
    <!-- <dialog> + showModal(): real modality (backdrop, focus trap,
         Escape) from the browser engine. Electron has no native
         text-input dialog. -->
    <dialog id="rename-dialog">
      <form method="dialog">
        <!-- the heading names the target: a tab or a workspace -->
        <h2 id="rename-heading">Rename Tab</h2>
        <input id="rename-input" type="text" spellcheck="false" />
        <div class="dialog-buttons">
          <!-- Cancel is type=button so Enter always means Rename -->
          <button type="button" id="rename-cancel">Cancel</button>
          <button value="rename" class="default">Rename</button>
        </div>
      </form>
    </dialog>
    <!-- Controls apply live: each change is an update-settings Command
         (settings-dialog.ts) -->
    <dialog id="settings-dialog">
      <h2>Settings</h2>
      <label class="settings-row">
        Theme
        <select id="settings-theme"></select>
      </label>
      <h3 class="settings-section">Terminal</h3>
      <label class="settings-row">
        Font
        <input id="settings-font-family" type="text" spellcheck="false" />
      </label>
      <label class="settings-row">
        Font size
        <input id="settings-font-size" type="number" min="8" max="32" />
      </label>
      <h3 class="settings-section">Interface</h3>
      <label class="settings-row">
        Font
        <input id="settings-ui-font-family" type="text" spellcheck="false" />
      </label>
      <h3 class="settings-section">Markdown</h3>
      <label class="settings-row">
        Font
        <input
          id="settings-markdown-font-family"
          type="text"
          spellcheck="false"
        />
      </label>
      <label class="settings-row">
        Font size
        <input
          id="settings-markdown-font-size"
          type="number"
          min="8"
          max="32"
        />
      </label>
      <div class="dialog-buttons">
        <button id="settings-done" class="default">Done</button>
      </div>
    </dialog>
    <!-- The painted title bar (style.css); the native one is hidden -->
    <!-- replaced by the active workspace's name as soon as one exists -->
    <div id="title-bar">lmux</div>
    <div id="workbench">
      <div id="sidebar">
        <!-- one row per workspace, filled by workspaces.ts. A tablist:
             picking one swaps which set of panes is on screen. -->
        <div id="workspace-list" role="tablist" aria-label="Workspaces"></div>
        <button id="new-workspace-button" title="New Workspace (⇧⌘T)">
          + New Workspace
        </button>
        <button id="settings-button" title="Settings" aria-label="Settings">
          ⚙
        </button>
      </div>
      <!-- drag handle over the sidebar's edge (edge-resize.ts) -->
      <div id="sidebar-resizer"></div>
      <!-- one Dockview root per workspace, only the active one displayed
           (workspaces.ts) -->
      <div id="layout" role="tabpanel" aria-label="Workspace"></div>
      <!-- the workspace's editor: one project panel per workspace, only the
           active one displayed, and the host collapsed while it is hidden
           (project-panel.ts) -->
      <div id="project" style="display: none">
        <!-- drag handle over the panel's inner edge (edge-resize.ts) -->
        <div id="project-resizer"></div>
      </div>
    </div>
    <!-- the page's one entry; Vite follows its imports from here -->
    <script type="module" src="./index.ts"></script>
  </body>
</html>
