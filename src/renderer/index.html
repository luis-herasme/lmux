<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Mermaid injects a <style> per diagram and this page has style
         attributes of its own; Monaco brings the Codicon font, which the
         build may emit inline. Electron warns because a file:// page has no
         response CSP header; the equivalent meta policy below is enforced
         (ARCHITECTURE.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <title>lmux</title>
    <!-- code token colors; settings.ts puts the palette this theme wants
         here. Every other stylesheet is imported by the module needing it. -->
    <link rel="stylesheet" id="highlight-css" />
  </head>
  <body>
    <!-- The two modals, drawn only while one is open (chrome.tsx) -->
    <div id="dialogs"></div>
    <!-- The window has no title bar of its own: the three regions run the
         full height, so the lines between them are the window's own
         divisions, top to bottom. -->
    <div id="workbench" class="relative flex min-h-0 flex-1">
      <!-- the named workspace list at the top, settings gear at the bottom;
           both are drawn by chrome.tsx, and the empty strip below them
           belongs to this element (workspaces.ts) -->
      <div
        id="sidebar"
        class="flex w-(--sidebar-width) flex-none flex-col border-r border-separator bg-tab-bar pb-2"
      ></div>
      <!-- Rides over the sidebar's edge instead of taking a column of its
           own, so widening it costs the layout nothing (edge-resize.ts) -->
      <div
        id="sidebar-resizer"
        class="absolute inset-y-0 left-[calc(var(--sidebar-width)-2px)] z-2 w-[5px] cursor-col-resize"
      ></div>
      <!-- one Dockview root per workspace, only the active one displayed
           (workspaces.ts) -->
      <div
        id="panes"
        role="tabpanel"
        aria-label="Workspace"
        class="flex min-w-0 flex-1"
      ></div>
      <!-- one editor per workspace, only the
           active one displayed, and the host collapsed while it is hidden
           (editor.ts) -->
      <div
        id="editor"
        style="display: none"
        class="relative w-(--editor-width) min-w-0 flex-none border-l border-separator bg-background"
      >
        <!-- drag handle over the editor's inner edge (edge-resize.ts) -->
        <div
          id="editor-resizer"
          class="absolute inset-y-0 left-[-3px] z-2 w-[5px] cursor-col-resize"
        ></div>
        <!-- the root the editors are drawn into (editor-view.tsx); the
             handle above is not React's, which is why it is not this element -->
        <div id="editors" class="h-full"></div>
      </div>
    </div>
    <!-- the page's one entry; Vite follows its imports from here -->
    <script type="module" src="./index.ts"></script>
  </body>
</html>
